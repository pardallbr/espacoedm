<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Aulas - Espaço EDM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; font-size: 24px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 4px; font-size: 16px; box-sizing: border-box;
        }
        button {
            background-color: #3498db; color: white; border: none;
            cursor: pointer; margin-top: 10px; font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        .total-box {
            margin-top: 20px; font-size: 18px; font-weight: bold;
            text-align: right; background: #eef2f3; padding: 15px; border-radius: 4px;
        }
        .config-section {
            background: #f9f9f9; padding: 15px; border-radius: 6px;
            margin-bottom: 20px; border: 1px solid #e1e1e1;
        }
        .auth-box { background: #e8f8f5; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #a3e4d7; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Relatório Mensal de Aulas - Espaço EDM</h1>
    <p>Integração automática com o seu Google Agenda.</p>

    <!-- Botão de Login do Google -->
    <div class="auth-box" id="authSection">
        <p>Para puxar os dados direto da sua agenda, faça login com a sua conta Google:</p>
        <button id="authorize_button" style="background-color: #27ae60; width: auto; padding: 10px 20px;">A carregar sistema do Google...</button>
    </div>

    <div class="config-section">
        <h3>1. Configurar Valores dos Pacientes (R$)</h3>
        <p style="font-size: 14px; color: #666;">Defina o preço cobrado por aula para cada paciente:</p>
        <div id="tabelaPrecos">
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" placeholder="Nome do Paciente (ex: João Silva)" class="paciente-nome">
                <input type="number" placeholder="Valor por Aula (R$)" class="paciente-valor" style="width: 150px;">
            </div>
        </div>
        <button type="button" id="btnAddPaciente" style="background-color: #2ecc71; width: auto; padding: 6px 15px; font-size: 14px;">+ Adicionar Outro Paciente</button>
    </div>

    <div class="form-group">
        <label for="mesAno">Selecione o Mês de Referência:</label>
        <input type="month" id="mesAno">
    </div>

    <button id="btnGerar" disabled style="background-color: #bdc3c7;">Gerar Relatório da Agenda</button>

    <div id="resultado" style="margin-top: 30px;"></div>
</div>

<!-- Bibliotecas oficiais do Google -->
<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

<script>
    const CLIENT_ID = '846101014697-c0jfi4ag8jnmusdr4q2vstl4hlh3pobd.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyArLsqmBTkGynvYwAbb5diFFt7eSXDvGSs';
    const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest';
    const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    const authorizeButton = document.getElementById('authorize_button');
    const btnGerar = document.getElementById('btnGerar');

    function gapiLoaded() {
        gapi.load('client', initializeGapiClient);
    }

    async function initializeGapiClient() {
        try {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: [DISCOVERY_DOC],
            });
            gapiInited = true;
            verificarPronto();
        } catch (err) {
            console.error("Erro ao iniciar GAPI:", err);
        }
    }

    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,
            callback: '', 
        });
        gisInited = true;
        verificarPronto();
    }

    function verificarPronto() {
        if (gapiInited && gisInited) {
            authorizeButton.innerText = "Conectar ao Google Agenda";
            authorizeButton.style.backgroundColor = "#27ae60";
            authorizeButton.onclick = handleAuthClick;
        }
    }

    function handleAuthClick() {
        tokenClient.callback = async (resp) => {
            if (resp.error !== undefined) {
                alert("Erro na autenticação: " + JSON.stringify(resp));
                return;
            }
            authorizeButton.innerText = "Conectado com Sucesso!";
            authorizeButton.style.backgroundColor = "#7f8c8d";
            btnGerar.disabled = false;
            btnGerar.style.backgroundColor = "#3498db";
        };

        if (gapi.getToken() === null) {
            tokenClient.requestAccessToken({prompt: 'consent'});
        } else {
            tokenClient.requestAccessToken({prompt: ''});
        }
    }

    document.getElementById('btnAddPaciente').addEventListener('click', function() {
        const container = document.getElementById('tabelaPrecos');
        const novaLinha = document.createElement('div');
        novaLinha.style.cssText = "display: flex; gap: 10px; margin-bottom: 10px;";
        novaLinha.innerHTML = `
            <input type="text" placeholder="Nome do Paciente" class="paciente-nome">
            <input type="number" placeholder="Valor por Aula (R$)" class="paciente-valor" style="width: 150px;">
        `;
        container.appendChild(novaLinha);
    });

    btnGerar.addEventListener('click', async function() {
        const mesSelecionado = document.getElementById('mesAno').value;
        if (!mesSelecionado) {
            alert('Por favor, selecione o mês de referência!');
            return;
        }

        const [ano, mes] = mesSelecionado.split('-');
        const dataInicio = new Date(ano, mes - 1, 1).toISOString();
        const dataFim = new Date(ano, mes, 0, 23, 59, 59).toISOString();

        try {
            const response = await gapi.client.calendar.events.list({
                'calendarId': 'primary',
                'timeMin': dataInicio,
                'timeMax': dataFim,
                'singleEvents': true,
                'orderBy': 'startTime',
            });

            const eventos = response.result.items;
            processarRelatorio(eventos, mesSelecionado);

        } catch (err) {
            alert('Erro ao carregar os eventos da agenda: ' + err.message);
        }
    });

    function processarRelatorio(eventos, mesSelecionado) {
        const nomesInputs = document.querySelectorAll('.paciente-nome');
        const valoresInputs = document.querySelectorAll('.paciente-valor');
        const tabelaValores = {};

        for (let i = 0; i < nomesInputs.length; i++) {
            const nome = nomesInputs[i].value.trim().toLowerCase();
            const valor = parseFloat(valoresInputs[i].value) || 0;
            if (nome) tabelaValores[nome] = valor;
        }

        const contagemAulas = {};

        eventos.forEach(evento => {
            const titulo = evento.summary ? evento.summary.trim().toLowerCase() : '';
            if (titulo) {
                contagemAulas[titulo] = (contagemAulas[titulo] || 0) + 1;
            }
        });

        let htmlResultado = `
            <h3>Relatório da Agenda para o mês: ${mesSelecionado}</h3>
            <table>
                <thead>
                    <tr>
                        <th>Paciente / Evento</th>
                        <th>Aulas Dadas</th>
                        <th>Valor da Aula (R$)</th>
                        <th>Total a Receber (R$)</th>
                    </tr>
                </thead>
                <tbody>
        `;

        let valorTotalGeral = 0;

        for (const [paciente, qtdAulas] of Object.entries(contagemAulas)) {
            let valorUnitario = 0;
            for (const [key, val] of Object.entries(tabelaValores)) {
                if (paciente.includes(key) || key.includes(paciente)) {
                    valorUnitario = val;
                    break;
                }
            }

            const totalPaciente = qtdAulas * valorUnitario;
            valorTotalGeral += totalPaciente;
            const nomeFormatado = paciente.charAt(0).toUpperCase() + paciente.slice(1);

            htmlResultado += `
                <tr>
                    <td>${nomeFormatado}</td>
                    <td>${qtdAulas}</td>
                    <td>R$ ${valorUnitario.toFixed(2)}</td>
                    <td>R$ ${totalPaciente.toFixed(2)}</td>
                </tr>
            `;
        }

        htmlResultado += `
                </tbody>
            </table>
            <div class="total-box">
                Valor Total do Mês: R$ ${valorTotalGeral.toFixed(2)}
            </div>
        `;

        document.getElementById('resultado').innerHTML = htmlResultado;
    }
</script>

</body>
</html>
