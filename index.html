<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório de Aulas - Espaço EDM</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f6;color:#333;margin:0;padding:20px}
.container{max-width:900px;margin:0 auto;background:#fff;padding:30px;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.1)}
h1{color:#2c3e50;font-size:24px}h3{margin-top:25px;color:#2c3e50}
input,button{padding:10px;border:1px solid #ccc;border-radius:4px;font-size:16px;box-sizing:border-box}
button{background:#3498db;color:#fff;border:none;cursor:pointer;font-weight:bold;margin-top:10px;padding:10px 20px}
button:disabled{background:#bdc3c7;cursor:not-allowed}
#btnAuth:not(:disabled){background:#27ae60}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:10px;text-align:left}
th{background:#2c3e50;color:#fff}
td input[type=number]{width:120px}
.total-box{margin-top:20px;font-size:18px;font-weight:bold;text-align:right;background:#eef2f3;padding:15px;border-radius:4px}
.auth-box{background:#e8f8f5;padding:15px;border-radius:6px;margin-bottom:20px;border:1px solid #a3e4d7;text-align:center}
.erro-box{background:#fdecea;border:1px solid #f5c6cb;color:#611a15;padding:12px;border-radius:6px;margin-top:15px;font-size:14px}
.chk{display:block;margin:6px 0}
</style>
</head>
<body>
<div class="container">
<h1>Relatório Mensal de Aulas - Espaço EDM</h1>
<div class="auth-box">
<button id="btnAuth" disabled>Carregando sistema do Google...</button>
<div id="msg"></div>
</div>
<div id="app" style="display:none">
<div id="blocoAg"><h3>Escolha as agendas</h3>
<div id="agendas"></div></div>
<h3>1. Mês de referência</h3>
<input type="month" id="mes">
<br><label class="chk" style="margin-top:12px">Contar sessões até o dia: <input type="date" id="ate"></label>
<br><button id="btnBuscar">Buscar crianças da agenda</button>
<div id="lista"></div>
<div id="resultado"></div>
</div>
</div>

<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
<script>
const CLIENT_ID='846101014697-0nrq60gv7sgelmgtslncq3a0cds0osff.apps.googleusercontent.com';
const API_KEY='AIzaSyArLsqmBTkGynvYwAbb5diFFt7eSXDvGSs';
const SCOPES='https://www.googleapis.com/auth/calendar.readonly';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let tokenClient,gapiOk=false,gisOk=false,dados=[];

function dataLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ajustaAte(){const mes=$('mes').value;if(!mes)return;const p=mes.split('-').map(Number),h=new Date(),atual=h.getFullYear()===p[0]&&h.getMonth()+1===p[1];$('ate').value=dataLocal(atual?h:new Date(p[0],p[1],0))}
function erro(m){$('msg').innerHTML='<div class="erro-box">'+m+'</div>'}
function falha(e){
  const st=e&&(e.status||(e.result&&e.result.error&&e.result.error.code));
  if(st===401||st===403){LS.set('edm_token',null);erro('Sua conexão com o Google expirou. Recarregue a página e clique em "Reconectar".')}
  else erro('Erro: '+((e&&e.result&&e.result.error&&e.result.error.message)||(e&&e.message)||'desconhecido'));
}
function gapiLoaded(){gapi.load('client',async()=>{
  try{await gapi.client.init({apiKey:API_KEY,discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest']});gapiOk=true;pronto()}
  catch(e){erro('Erro ao iniciar a API do Google. Confira a API Key e se a Google Calendar API está ativada.')}
})}
function gisLoaded(){
  try{tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:onToken,
    error_callback:e=>erro('Erro no login ('+(e.type||'desconhecido')+'). Confira a origem autorizada no Google Cloud.')});
    gisOk=true;pronto()}
  catch(e){erro('Erro ao iniciar o login do Google. Confira o CLIENT_ID.')}
}
function pronto(){
  if(!(gapiOk&&gisOk))return;
  const t=LS.get('edm_token',null);
  if(t&&t.exp>Date.now()){gapi.client.setToken({access_token:t.token});conectado();return}
  const ja=LS.get('edm_ja',false),b=$('btnAuth');
  b.disabled=false;
  b.textContent=ja?'Reconectar ao Google Agenda':'Conectar ao Google Agenda';
  b.onclick=()=>tokenClient.requestAccessToken({prompt:ja?'':'consent'});
}
function onToken(r){
  if(r.error){erro('Erro na autenticação: '+r.error);return}
  gapi.client.setToken({access_token:r.access_token});
  LS.set('edm_token',{token:r.access_token,exp:Date.now()+(r.expires_in-120)*1000});
  LS.set('edm_ja',true);conectado();
}
async function conectado(){
  $('btnAuth').textContent='Conectado ✓';$('btnAuth').disabled=true;$('msg').innerHTML='';
  $('app').style.display='block';
  $('mes').value=dataLocal(new Date()).slice(0,7);$('mes').onchange=ajustaAte;ajustaAte();
  try{
    const r=await gapi.client.calendar.calendarList.list();
    const alvo=r.result.items.find(c=>[c.summary,c.summaryOverride].some(x=>/pardal agenda/i.test(x||'')));
    if(alvo){$('agendas').innerHTML='<input type="checkbox" class="ag" value="'+esc(alvo.id)+'" checked hidden>';$('blocoAg').style.display='none';return}
    $('blocoAg').style.display='block';
    const sel=LS.get('edm_ags',null);
    $('agendas').innerHTML=r.result.items.map(c=>{
      const ck=sel?sel.includes(c.id):!!c.primary;
      return '<label class="chk"><input type="checkbox" class="ag" value="'+esc(c.id)+'" '+(ck?'checked':'')+'> '+esc(c.summary)+'</label>';
    }).join('');
  }catch(e){falha(e)}
}

$('btnBuscar').onclick=async()=>{
  const mes=$('mes').value,ags=[...document.querySelectorAll('.ag:checked')].map(x=>x.value);
  if(!mes){alert('Escolha o mês.');return}
  if(!ags.length){alert('Marque pelo menos uma agenda.');return}
  LS.set('edm_ags',ags);
  $('lista').innerHTML='<p>Buscando na agenda...</p>';$('resultado').innerHTML='';$('msg').innerHTML='';
  const [a,m]=mes.split('-'),ini=new Date(a,m-1,1).toISOString(),[ay,am,ad]=($('ate').value||mes+'-01').split('-').map(Number),fim=new Date(ay,am-1,ad+1).toISOString(),mapa={};
  try{
    for(const id of ags){
      let pt;
      do{
        const p={calendarId:id,timeMin:ini,timeMax:fim,singleEvents:true,orderBy:'startTime',maxResults:2500};
        if(pt)p.pageToken=pt;
        const r=await gapi.client.calendar.events.list(p);
        (r.result.items||[]).forEach(ev=>{
          if(ev.status==='cancelled'||!ev.summary||!/[\p{L}\p{N}]/u.test(ev.summary))return;
          const nome=ev.summary.trim(),k=nome.toLowerCase();
          (mapa[k]=mapa[k]||{nome:nome,n:0}).n++;
        });
        pt=r.result.nextPageToken;
      }while(pt);
    }
  }catch(e){falha(e);$('lista').innerHTML='';return}
  dados=Object.keys(mapa).map(k=>({k:k,nome:mapa[k].nome,n:mapa[k].n})).sort((x,y)=>x.nome.localeCompare(y.nome));
  if(!dados.length){$('lista').innerHTML='<div class="erro-box">Nenhum evento encontrado nesse mês.</div>';return}
  const vals=LS.get('edm_vals',{}),off=LS.get('edm_off',{});
  $('lista').innerHTML='<h3>2. Desmarque o que não é criança e coloque o valor da sessão</h3>'+
    '<table><thead><tr><th>Incluir</th><th>Nome no evento</th><th>Sessões</th><th>Valor (R$)</th></tr></thead><tbody>'+
    dados.map((d,i)=>'<tr><td><input type="checkbox" class="inc" data-i="'+i+'" '+(off[d.k]?'':'checked')+'></td><td>'+esc(d.nome)+'</td><td>'+d.n+'</td><td><input type="number" step="0.01" min="0" class="val" data-i="'+i+'" value="'+(vals[d.k]!==undefined?vals[d.k]:'')+'"></td></tr>').join('')+
    '</tbody></table><button id="btnCalc">Calcular total do mês</button>';
  $('btnCalc').onclick=calcular;
};

function calcular(){
  const vals=LS.get('edm_vals',{}),off=LS.get('edm_off',{}),linhas=[];let tot=0;
  dados.forEach((d,i)=>{
    const inc=document.querySelector('.inc[data-i="'+i+'"]').checked;
    const v=parseFloat(document.querySelector('.val[data-i="'+i+'"]').value)||0;
    off[d.k]=!inc;if(v)vals[d.k]=v;else delete vals[d.k];
    if(inc){const t=d.n*v;tot+=t;linhas.push([d.nome,d.n,v,t])}
  });
  LS.set('edm_vals',vals);LS.set('edm_off',off);
  const f=n=>'R$ '+n.toFixed(2).replace('.',','),c=n=>n.toFixed(2).replace('.',',');
  $('resultado').innerHTML='<h3>Relatório de '+$('mes').value+' (sessões até '+($('ate').value||'').split('-').reverse().join('/')+')</h3>'+
    '<table><thead><tr><th>Criança</th><th>Sessões</th><th>Valor da sessão</th><th>Total</th></tr></thead><tbody>'+
    linhas.map(l=>'<tr><td>'+esc(l[0])+'</td><td>'+l[1]+'</td><td>'+f(l[2])+'</td><td>'+f(l[3])+'</td></tr>').join('')+
    '</tbody></table><div class="total-box">Valor Total do Mês: '+f(tot)+'</div><button id="btnCsv">Baixar planilha (CSV)</button>';
  $('btnCsv').onclick=()=>{
    const rows=['Criança;Sessões;Valor da sessão;Total'].concat(linhas.map(l=>'"'+l[0].replace(/"/g,'""')+'";'+l[1]+';'+c(l[2])+';'+c(l[3]))).concat(['"TOTAL";;;'+c(tot)]);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));
    a.download='relatorio-'+$('mes').value+'.csv';a.click();
  };
  $('resultado').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
